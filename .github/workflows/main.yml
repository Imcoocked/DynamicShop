name: Patch and Build
on:
  push:
    branches: [main, master]
  workflow_dispatch:
jobs:
  patch-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Patch getPluginMeta → getDescription
        run: |
          find src -name "DynamicShopExpansion.java" -exec \
            sed -i 's/getPluginMeta()\.getVersion()/getDescription().getVersion()/g' {} +
      - name: Install CoinsEngine locally
        run: |
          mvn install:install-file \
            -Dfile=libs/CoinsEngine-2.6.0.jar \
            -DgroupId=su.nightexpress.coinsengine \
            -DartifactId=CoinsEngine \
            -Dversion=2.6.0 \
            -Dpackaging=jar
      - name: Build
        run: mvn package -B -DskipTests
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DynamicShop-patched
          path: target/DynamicShop-*.jar
