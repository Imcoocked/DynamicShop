name: Patch and Build
on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  patch-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Patch getPluginMeta → getDescription
        run: |
          find src -name "DynamicShopExpansion.java" -exec \
            sed -i 's/getPluginMeta()\.getVersion()/getDescription().getVersion()/g' {} +

      - name: Patch Folia scheduler → Bukkit scheduler
        run: |
          FILE=$(find src -name "ShopDataManager.java")
          echo "Patching $FILE"

          # Replace Folia import with Bukkit
          sed -i 's|import io.papermc.paper.threadedregions.scheduler.ScheduledTask;|import org.bukkit.scheduler.BukkitTask;|g' "$FILE"

          # Replace field types
          sed -i 's/public static ScheduledTask saveTimer;/public static BukkitTask saveTimer;/g' "$FILE"
          sed -i 's/private static ScheduledTask shortageTicker;/private static BukkitTask shortageTicker;/g' "$FILE"

          # Replace saveTimer scheduler call
          perl -i -0pe '
            s/plugin\.getServer\(\)\.getGlobalRegionScheduler\(\)\.runAtFixedRate\(\s*\n?\s*plugin,\s*task\s*->\s*saveQueuedItems\(\),\s*([^,]+),\s*([^)]+)\)/Bukkit.getScheduler().runTaskTimer(plugin, () -> saveQueuedItems(), $1, $2)/g
          ' "$FILE"

          # Replace shortageTicker scheduler call
          perl -i -0pe '
            s/plugin\.getServer\(\)\.getGlobalRegionScheduler\(\)\.runAtFixedRate\(\s*\n?\s*plugin,\s*task\s*->\s*tickAllShortage\(\),\s*([^,]+),\s*([^)]+)\)/Bukkit.getScheduler().runTaskTimer(plugin, () -> tickAllShortage(), $1, $2)/g
          ' "$FILE"

          echo "Verifying no Folia references remain:"
          grep -n "GlobalRegionScheduler\|ScheduledTask" "$FILE" || echo "Clean!"

      - name: Install CoinsEngine locally
        run: |
          mvn install:install-file \
            -Dfile=libs/CoinsEngine-2.6.0.jar \
            -DgroupId=su.nightexpress.coinsengine \
            -DartifactId=CoinsEngine \
            -Dversion=2.6.0 \
            -Dpackaging=jar

      - name: Build
        run: mvn package -B -DskipTests

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DynamicShop-patched
          path: target/DynamicShop-*.jar
